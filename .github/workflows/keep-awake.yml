# Render's free tier puts the site to sleep after 15 minutes without visitors,
# and the first visit after that waits up to a minute. Visiting it every
# 10 minutes keeps it awake.
name: Keep site awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: # allows a manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Visit the site
        run: |
          for attempt in 1 2 3; do
            if curl -fsS -m 90 -o /dev/null -w "HTTP %{http_code} in %{time_total}s\n" https://chess-engine-1smz.onrender.com/; then
              exit 0
            fi
            sleep 20
          done
          echo "Site did not respond after 3 tries" && exit 1
